name: Frontend CI

# Pull requests run this through ci.yml (workflow_call), which owns the path
# filters and concurrency. Keep these paths in sync with the "frontend" filter there.
on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - src/web/**
      - .github/workflows/frontend-ci.yml

permissions:
  contents: read

defaults:
  run:
    working-directory: src/web

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm must be installed before setup-node so its pnpm cache works.
      # The version comes from "packageManager" in src/web/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build
