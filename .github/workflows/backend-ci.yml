name: Backend CI

# Pull requests run this through ci.yml (workflow_call), which owns the path
# filters and concurrency. Keep these paths in sync with the "backend" filter there.
on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - src/EggsApp.Api/**
      - src/EggsApp.Desktop/**
      - tests/**
      - Directory.Build.props
      - global.json
      - EggsApp.sln
      - .github/workflows/backend-ci.yml

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    # EggsApp.Desktop targets net10.0-windows, so the build requires Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build --no-restore -warnaserror

      - run: dotnet test --no-build
